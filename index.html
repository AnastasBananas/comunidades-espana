<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunidades de España</title>
<meta name="description" content="Juego de geografía: toca una comunidad autónoma y escribe su nombre, o encuéntrala en el mapa. Con pistas, repaso de fallos y versión en ES, RU y EN.">
<meta name="theme-color" content="#eef3f4">
<meta property="og:type" content="website">
<meta property="og:title" content="Comunidades de España · Juego del mapa">
<meta property="og:description" content="Juego de geografía: toca una comunidad autónoma y escribe su nombre, o encuéntrala en el mapa. Con pistas, repaso de fallos y versión en ES, RU y EN.">
<meta property="og:url" content="https://anastasbananas.github.io/comunidades-espana/">
<meta property="og:image" content="https://anastasbananas.github.io/comunidades-espana/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%3E%3Crect%20width%3D'32'%20height%3D'32'%20rx%3D'7'%20fill%3D'%23b3191f'%2F%3E%3Crect%20y%3D'9'%20width%3D'32'%20height%3D'14'%20fill%3D'%23f2bd00'%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: an atlas sheet. The map fills the left, a notebook-style quiz panel sits on the right; on phones the panel stacks under the map. */
:root {
  --bg: #eef3f4; --surface: #ffffff; --field: #f6f9fa; --ink: #1c2a33; --muted: #5a6b75; --line: #d6e0e4;
  --sea: #cfe4ec; --land: #fbfcf9; --land-hover: #fff3bf; --neighbor: #e6e3da; --neighbor-line: #cbc7bb;
  --accent: #b3191f; --accent-ink: #ffffff; --accent-soft: #f8dcdc;
  --gold: #e0a800; --sel-bg: #ffe27a; --sel-line: #e8ad00;
  --ok: #1d7f46; --ok-soft: #dff3e6; --bad: #c62828; --bad-soft: #fde4e4; --warn: #8a5d00; --warn-soft: #fff1cc;
  --halo: #ffffff; --rs: 70%; --rl: 77%; --rs-dim: 18%; --rl-dim: 84%;
  --font-display: "Unbounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11191e; --surface: #19242b; --field: #121b21; --ink: #e4edf1; --muted: #93a6b0; --line: #2a3943;
    --sea: #14303c; --land: #24313a; --land-hover: #4a4320; --neighbor: #1b262d; --neighbor-line: #2f3f49;
    --accent: #e5484d; --accent-ink: #ffffff; --accent-soft: #4a1f22;
    --gold: #f5c518; --sel-bg: #8a7417; --sel-line: #b8981c;
    --ok: #5ad08f; --ok-soft: #173a28; --bad: #ff7b7b; --bad-soft: #47201f; --warn: #f2c94c; --warn-soft: #3d3214;
    --halo: #11191e; --rs: 42%; --rl: 44%; --rs-dim: 10%; --rl-dim: 32%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11191e; --surface: #19242b; --field: #121b21; --ink: #e4edf1; --muted: #93a6b0; --line: #2a3943;
  --sea: #14303c; --land: #24313a; --land-hover: #4a4320; --neighbor: #1b262d; --neighbor-line: #2f3f49;
  --accent: #e5484d; --accent-ink: #ffffff; --accent-soft: #4a1f22;
  --gold: #f5c518; --sel-bg: #8a7417; --sel-line: #b8981c;
  --ok: #5ad08f; --ok-soft: #173a28; --bad: #ff7b7b; --bad-soft: #47201f; --warn: #f2c94c; --warn-soft: #3d3214;
  --halo: #11191e; --rs: 42%; --rl: 44%; --rs-dim: 10%; --rl-dim: 32%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sel-line); outline-offset: 2px; }

.app { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.brand { min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.25rem, 2.4vw, 1.85rem); letter-spacing: -0.01em; line-height: 1.15; text-wrap: balance; }
.brand p { margin: 4px 0 0; color: var(--muted); font-weight: 600; font-size: 0.95rem; }

.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 0.55rem 1rem; border-radius: 999px; font-weight: 800; font-size: 0.95rem; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 16px; align-items: start; }

.map-wrap { position: relative; background: var(--sea); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
#map { display: block; width: 100%; height: auto; max-height: calc(100vh - 120px); max-height: calc(100dvh - 120px); touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

/* map layers */
.sea { fill: var(--sea); }
.neighbors path { fill: var(--neighbor); stroke: var(--neighbor-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.inset { fill: var(--sea); stroke: var(--muted); stroke-width: 1.2; vector-effect: non-scaling-stroke; cursor: pointer; }
.isl { fill: transparent; stroke: var(--muted); stroke-opacity: 0.55; stroke-width: 1; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; cursor: pointer; pointer-events: all; }
.hit.selected { stroke: var(--sel-line); stroke-opacity: 1; stroke-width: 2.5; stroke-dasharray: none; }
.hit.given, .hit.solved { cursor: default; }
.mini { fill: var(--land); stroke: var(--ink); stroke-width: 0.8; vector-effect: non-scaling-stroke; pointer-events: none; }
.reg { fill: var(--land); stroke: var(--ink); stroke-width: 1.25; stroke-linejoin: round; vector-effect: non-scaling-stroke; cursor: pointer; }
.reg:focus { outline: none; }
.reg:focus-visible { stroke: var(--accent); stroke-width: 3; }
@media (hover: hover) { .reg:not(.solved):not(.given):hover { fill: var(--land-hover); } }
.reg.solved, .reg.given { fill: hsl(var(--h) var(--rs) var(--rl)); cursor: default; }
.reg.revealed { fill: hsl(var(--h) var(--rs-dim) var(--rl-dim)); }
.reg.selected { fill: url(#hatch); stroke-width: 2.2; }
.reg.city { stroke-dasharray: 3 2; }
.reg.city.selected, .reg.city.solved, .reg.city.given { stroke-dasharray: none; }
.off { display: none; }
.hatch-bg { fill: var(--sel-bg); }
.hatch-line { fill: var(--sel-line); }
.reg.wrong { animation: wrong 0.9s ease; }
.reg.pointing { animation: point 0.45s ease 4 alternate; stroke: var(--accent); stroke-width: 2.5; }
.reg.hinting { animation: hint 1.1s ease-in-out infinite; }
@keyframes wrong { 15%, 55% { fill: var(--bad); } }
@keyframes point { to { fill: var(--accent-soft); } }
@keyframes hint { 50% { fill: var(--sel-bg); } }

.lbl { font-family: var(--font-body); font-weight: 800; font-size: calc(var(--fs) * 1px); fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 3.5px; stroke-linejoin: round; text-anchor: middle; dominant-baseline: central; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
.lbl.show { opacity: 1; }
.lbl.peek { opacity: 1; fill: var(--accent); }
.lbl.pop { animation: pop 0.55s cubic-bezier(0.3, 1.6, 0.5, 1); transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { transform: scale(0.3); opacity: 0; } }

/* panel */
.panel { display: flex; flex-direction: column; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.quiz { display: flex; flex-direction: column; gap: 12px; }
.quiz h2 { margin: 0; font-size: 1.2rem; font-weight: 900; line-height: 1.25; text-wrap: balance; }
.quiz p { margin: 0; color: var(--muted); font-weight: 600; }
.eyebrow { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.target { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.35rem, 3vw, 1.75rem); line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.badge { align-self: flex-start; font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }

.answer { display: flex; gap: 8px; }
.answer input { flex: 1; min-width: 0; font: 700 1.15rem var(--font-body); color: var(--ink); background: var(--field); border: 2px solid var(--line); border-radius: 10px; padding: 0.65rem 0.8rem; }
.answer input::placeholder { color: var(--muted); font-weight: 600; }
.answer input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--sel-bg); }
.btn { border: 0; border-radius: 10px; padding: 0.65rem 1rem; font-weight: 800; cursor: pointer; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: var(--muted); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.note { font-size: 0.85rem; }
.shake { animation: shake 0.4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.slots { display: flex; flex-wrap: wrap; gap: 4px 3px; align-items: flex-end; }
.slot { width: 1.25em; height: 1.6em; border-bottom: 2px solid var(--muted); text-align: center; font-weight: 900; font-size: 1.1rem; line-height: 1.6em; }
.slot.on { border-color: var(--ink); }
.gap { width: 0.7em; }
.sym { font-weight: 900; font-size: 1.1rem; }

.fb { padding: 0.55rem 0.75rem; border-radius: 10px; font-weight: 800; }
.fb.ok { background: var(--ok-soft); color: var(--ok); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.fb.warn { background: var(--warn-soft); color: var(--warn); }
.fb.info { background: var(--field); color: var(--ink); }

.stars { font-size: 2rem; letter-spacing: 0.1em; color: var(--gold); line-height: 1; }
.done-title { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; margin: 0; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; justify-content: space-between; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat span { display: block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.2; color: var(--muted); }
.stat b { display: block; font-family: var(--font-display); font-weight: 500; font-size: 1.2rem; font-variant-numeric: tabular-nums; }

.atlas h2 { margin: 0 0 10px; font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.atlas p { margin: 0 0 10px; color: var(--muted); font-size: 0.9rem; font-weight: 600; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.legend li { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 5px 9px; border-radius: 9px; font-weight: 800; font-size: 0.88rem; line-height: 1.2; min-width: 0; }
.legend li.chip { background: var(--field); cursor: pointer; }
.legend li.chip:hover { outline: 1.5px solid var(--line); }
.legend li.empty { border: 1.5px dashed var(--line); }
.legend li.rev { font-style: italic; color: var(--muted); }
.dot { flex: none; width: 13px; height: 13px; border-radius: 50%; background: hsl(var(--h) var(--rs) var(--rl)); border: 1px solid var(--ink); }
.legend li.rev .dot { background: hsl(var(--h) var(--rs-dim) var(--rl-dim)); }
.legend .nm { min-width: 0; overflow-wrap: anywhere; }

.settings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-weight: 700; font-size: 0.9rem; }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 0.35rem 0.6rem; font-weight: 800; font-size: 0.82rem; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.toggle { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--line); background: transparent; border-radius: 9px; padding: 0.35rem 0.65rem; font-weight: 800; font-size: 0.85rem; cursor: pointer; color: var(--muted); }
.toggle[aria-pressed="true"] { color: var(--ink); border-color: var(--muted); }
.toggle .sw { width: 26px; height: 15px; border-radius: 99px; background: var(--line); position: relative; transition: background 0.2s; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); transition: transform 0.2s; }
.toggle[aria-pressed="true"] .sw { background: var(--ok); }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(11px); }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); }
.confirm .btn { padding: 0.4rem 0.75rem; font-size: 0.88rem; }

.credits { margin: 0; color: var(--muted); font-size: 0.75rem; font-weight: 600; }
#confetti { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

@media (max-width: 880px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  #map { max-height: none; }
  .panel { position: static; }
  .lbl { font-size: calc(var(--fs) * 1.45px); stroke-width: 4.5px; }
}
@media (max-width: 480px) {
  .tabs { width: 100%; }
  .tabs button { flex: 1; padding-inline: 0.5rem; font-size: 0.88rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1 id="title" data-i18n="title">Comunidades de España</h1>
      <p id="subtitle"></p>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-write" aria-selected="true" data-i18n="tabWrite">Escribe el nombre</button>
      <button role="tab" id="tab-find" aria-selected="false" data-i18n="tabFind">Encuéntrala en el mapa</button>
    </nav>
  </header>

  <main class="layout">
    <section class="map-wrap">
      <svg id="map" role="group" aria-label="Mapa de España" xmlns="http://www.w3.org/2000/svg"></svg>
    </section>

    <aside class="panel">
      <div class="card quiz" id="quiz">
        <span class="badge" id="q-review" hidden></span>

        <div id="q-idle" class="quiz">
          <h2 id="idle-title"></h2>
          <p data-i18n="idleText"></p>
          <div class="row"><button class="btn btn-ghost" id="btn-pick" type="button" data-i18n="pick"></button></div>
        </div>

        <div id="q-ask" class="quiz" hidden>
          <h2 id="ask-title"></h2>
          <form class="answer" id="answer-form" autocomplete="off">
            <input id="answer" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-i18n-ph="placeholder" aria-labelledby="ask-title">
            <button class="btn btn-primary" type="submit" id="btn-check" data-i18n="check"></button>
          </form>
          <div class="slots" id="slots" hidden></div>
          <div class="row">
            <button class="btn btn-ghost" type="button" id="btn-hint" data-i18n="hint"></button>
            <button class="btn btn-ghost" type="button" id="btn-giveup" data-i18n="giveUp"></button>
          </div>
          <p class="note" data-i18n="note"></p>
        </div>

        <div id="q-find" class="quiz" hidden>
          <span class="eyebrow" data-i18n="findEyebrow"></span>
          <div class="target" id="find-target"></div>
          <div class="row"><button class="btn btn-ghost" type="button" id="btn-skip" data-i18n="skip"></button></div>
        </div>

        <div id="q-done" class="quiz" hidden>
          <div class="stars" id="done-stars" aria-hidden="true"></div>
          <h2 class="done-title" data-i18n="doneTitle"></h2>
          <p id="done-text"></p>
          <div class="row">
            <button class="btn btn-primary" type="button" id="btn-again" data-i18n="again"></button>
            <button class="btn btn-ghost" type="button" id="btn-review"></button>
          </div>
        </div>

        <div class="fb" id="fb" role="status" aria-live="polite" hidden></div>
      </div>

      <div class="stats">
        <div class="stat"><span data-i18n="statDone"></span><b id="st-done">0/17</b></div>
        <div class="stat"><span data-i18n="statFirst"></span><b id="st-first">0</b></div>
        <div class="stat"><span data-i18n="statTime"></span><b id="st-time">0:00</b></div>
      </div>

      <div class="card atlas">
        <h2 data-i18n="atlasTitle"></h2>
        <p id="atlas-empty" data-i18n="atlasEmpty"></p>
        <ul class="legend" id="legend"></ul>
      </div>

      <div class="settings">
        <div class="seg" role="group" aria-label="Idioma / Язык / Language">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="ru" aria-pressed="false">RU</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button class="toggle" type="button" id="tg-sound" aria-pressed="true"><span class="sw"></span><span data-i18n="sound"></span></button>
        <button class="toggle" type="button" id="tg-cities" aria-pressed="false"><span class="sw"></span><span data-i18n="cities"></span></button>
        <button class="btn btn-ghost" type="button" id="btn-restart" data-i18n="restart" style="padding:0.35rem 0.7rem;font-size:0.85rem"></button>
        <div class="confirm" id="confirm" hidden>
          <span data-i18n="confirmQ"></span>
          <button class="btn btn-primary" type="button" id="btn-yes" data-i18n="yes"></button>
          <button class="btn btn-ghost" type="button" id="btn-no" data-i18n="no"></button>
        </div>
      </div>
      <p class="credits"><span data-i18n="mapData"></span>: © Instituto Geográfico Nacional de España (CC BY 4.0) · Natural Earth</p>
    </aside>
  </main>
</div>
<canvas id="confetti" hidden></canvas>
<script src="map-data.js"></script>
<script>
(() => {
const MAP = window.MAP_DATA;

// h = atlas hue once named; fs = label size in map units; a = accepted answers (normalised by norm()).
const META = {
  '01': { n: 'Andalucía', h: 50, fs: 19, a: ['andalucia'] },
  '02': { n: 'Aragón', h: 195, fs: 17, a: ['aragon', 'arago'] },
  '03': { n: 'Asturias', full: 'Principado de Asturias', h: 140, fs: 13.5, a: ['asturias'] },
  '04': { n: 'Islas Baleares', full: 'Illes Balears (Islas Baleares)', h: 175, fs: 13.5, a: ['baleares', 'balears'], lp: [878, 438] },
  '05': { n: 'Canarias', full: 'Canarias (Islas Canarias)', h: 30, fs: 15, a: ['canarias'], lp: 'box' },
  '06': { n: 'Cantabria', h: 300, fs: 12.5, a: ['cantabria'] },
  '07': { n: 'Castilla y León', h: 28, fs: 18, a: ['castilla y leon', 'castilla leon'] },
  '08': { n: 'Castilla-La Mancha', h: 115, fs: 17, a: ['castilla la mancha', 'castilla mancha'] },
  '09': { n: 'Cataluña', h: 85, fs: 17, a: ['cataluna', 'catalunya'] },
  '10': { n: 'Comunidad Valenciana', lines: ['Comunidad', 'Valenciana'], h: 12, fs: 13, a: ['valenciana', 'valencia', 'pais valencia', 'pais valenciano'] },
  '11': { n: 'Extremadura', h: 175, fs: 16, a: ['extremadura'] },
  '12': { n: 'Galicia', h: 225, fs: 17, a: ['galicia', 'galiza'] },
  '13': { n: 'Madrid', full: 'Comunidad de Madrid', h: 330, fs: 13.5, a: ['madrid'] },
  '14': { n: 'Murcia', full: 'Región de Murcia', h: 265, fs: 13.5, a: ['murcia'] },
  '15': { n: 'Navarra', full: 'Comunidad Foral de Navarra', h: 350, fs: 13, a: ['navarra', 'nafarroa'] },
  '16': { n: 'País Vasco', full: 'País Vasco (Euskadi)', h: 210, fs: 12.5, a: ['pais vasco', 'euskadi'] },
  '17': { n: 'La Rioja', h: 285, fs: 12, a: ['rioja'] },
  '18': { n: 'Ceuta', full: 'Ciudad Autónoma de Ceuta', h: 12, fs: 13, a: ['ceuta'], city: true, lp: [296, 697], anchor: 'end' },

/* ---------- answers ---------- */
const ART = /^(el|la|las|los) /;
const PRE = /^(comunidad autonoma( de)?|comunidad foral( de)?|comunidad( de)?|comunitat( de)?|region( de)?|principado( de)?|ciudad autonoma( de)?|islas|illes|isla) /;
function norm(s) {
  let v = String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  v = v.replace(ART, '').replace(PRE, '').replace(ART, '');
  return v.trim();
}
const ALIASES = {};
for (const id of ALL) {
  const m = META[id];
  const list = [m.n, ...m.a];
  if (m.full && !m.full.includes('(')) list.push(m.full);
  ALIASES[id] = [...new Set(list.map(norm))];
}
function lev(a, b) {
  const row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = row[0]; row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return row[b.length];
}
const exactMatch = n => ALL.find(id => ALIASES[id].includes(n)) || null;
const nearMatch = (n, id) => ALIASES[id].some(a => lev(n, a) <= (a.length <= 5 ? 1 : a.length <= 9 ? 2 : 3));
// check(): 'ok' | 'other' (another community's name) | 'near' (spelling slip) | 'wrong' | 'empty'
function check(input, id) {
  const n = norm(input);
  if (!n) return { res: 'empty' };
  const hit = exactMatch(n);
  if (hit === id) return { res: 'ok' };
  if (hit) return { res: 'other', other: hit };
  if (nearMatch(n, id)) return { res: 'near' };
  return { res: 'wrong' };
}

/* ---------- state ---------- */
const prefs = { lang: 'es', sound: true, cities: false };
try { Object.assign(prefs, JSON.parse(localStorage.getItem('ccaa-prefs') || '{}')); } catch (e) {}
if (!I18N[prefs.lang]) prefs.lang = 'es';
function savePrefs() { try { localStorage.setItem('ccaa-prefs', JSON.stringify(prefs)); } catch (e) {} }

const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const fullPool = () => prefs.cities ? ALL.slice() : BASE.slice();
function newRound(mode, pool) {
  const p = pool ? pool.slice() : fullPool();
  return { pool: p, review: !!pool, solved: {}, order: [], tries: {}, hints: {}, selected: null,
    queue: mode === 'find' ? shuffle(p.slice()) : [], fb: null, started: false, elapsed: 0, since: 0, done: false };
}
let S = { mode: 'write', write: newRound('write'), find: newRound('find') };
const R = () => S[S.mode];

function t(key, vars) {
  const v = key in I18N[prefs.lang] ? I18N[prefs.lang][key] : I18N.es[key];
  return typeof v === 'string' && vars ? v.replace(/\{(\w+)\}/g, (_, k) => vars[k]) : v;
}
const praise = () => { const p = t('praise'); return p[Math.floor(Math.random() * p.length)]; };
const fullName = id => META[id].full || META[id].n;

/* ---------- clock ---------- */
function clockStart(r) { r.started = true; if (!r.since && !r.done) r.since = Date.now(); }
function clockStop(r) { if (r.since) { r.elapsed += Date.now() - r.since; r.since = 0; } }
const clockValue = r => r.elapsed + (r.since ? Date.now() - r.since : 0);
function fmtTime(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

/* ---------- sound ---------- */
let ac = null;
function tone(f, at, dur, type, gain) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(gain, at + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(ac.destination); o.start(at); o.stop(at + dur + 0.05);
}
function sfx(kind) {
  if (!prefs.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const now = ac.currentTime;
    if (kind === 'ok') { tone(784, now, 0.14, 'sine', 0.14); tone(1175, now + 0.09, 0.26, 'sine', 0.12); }
    else if (kind === 'bad') { tone(233, now, 0.16, 'triangle', 0.12); tone(175, now + 0.12, 0.24, 'triangle', 0.12); }
    else if (kind === 'soft') { tone(523, now, 0.18, 'sine', 0.07); }
    else if (kind === 'win') { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, now + i * 0.1, 0.3, 'sine', 0.12)); }
  } catch (e) {}
}

/* ---------- map ---------- */
const $ = id => document.getElementById(id);
const svg = $('map');
const els = {};    // id -> elements that carry the region's state (shape + hit area)
const shapes = {}; // id -> the focusable shape
const labels = {};
const timers = {};

function buildMap() {
  const { W, H, box } = MAP;
  const reg = {}; MAP.regions.forEach(r => { reg[r.id] = r; });
  let h = `<defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hatch-bg" width="9" height="9"/><rect class="hatch-line" width="3.2" height="9"/></pattern></defs>`;
  h += `<rect class="sea" width="${W}" height="${H}"/>`;
  h += `<g class="neighbors">${MAP.neighbors.map(n => `<path d="${n.d}"/>`).join('')}<path d="${reg['20'].d}"/></g>`;
  h += `<rect class="inset hit" data-id="05" x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" rx="12"/>`;
  const bb = reg['04'].b;
  h += `<rect class="isl hit" data-id="04" x="${bb[0][0] - 12}" y="${bb[0][1] - 12}" width="${bb[1][0] - bb[0][0] + 24}" height="${bb[1][1] - bb[0][1] + 24}" rx="16"/>`;
  h += '<g class="regions">';
  for (const id of BASE) h += `<path class="reg" data-id="${id}" style="--h:${META[id].h}" d="${reg[id].d}"/>`;
  for (const id of CITY) h += `<path class="mini" d="${reg[id].d}"/>`;
  for (const id of CITY) h += `<circle class="reg city" data-id="${id}" style="--h:${META[id].h}" cx="${reg[id].c[0]}" cy="${reg[id].c[1]}" r="11"/>`;
  h += '</g><g class="labels">';
  for (const id of ALL) {
    const m = META[id];
    let [x, y] = reg[id].lp, anchor = m.anchor || 'middle';
    if (m.lp === 'box') { x = box.x + box.w - 14; y = box.y + box.h - 16; anchor = 'end'; }
    else if (m.lp) { [x, y] = m.lp; }
    const body = m.lines ? m.lines.map((ln, i) => `<tspan x="${x}" dy="${i === 0 ? -0.55 : 1.1}em">${ln}</tspan>`).join('') : m.n;
    h += `<text class="lbl" data-for="${id}" x="${x}" y="${y}" style="--fs:${m.fs};text-anchor:${anchor}">${body}</text>`;
  }
  h += '</g>';
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = h;
  for (const id of ALL) {
    els[id] = [...svg.querySelectorAll(`[data-id="${id}"]`)];
    shapes[id] = svg.querySelector(`.reg[data-id="${id}"]`);
    labels[id] = svg.querySelector(`.lbl[data-for="${id}"]`);
    shapes[id].setAttribute('role', 'button');
  }
}

function flash(id, cls, ms, peek) {
  clearTimeout(timers[id + cls]);
  els[id].forEach(e => { e.classList.remove(cls); void e.getBoundingClientRect(); e.classList.add(cls); });
  if (peek) labels[id].classList.add('peek');
  timers[id + cls] = setTimeout(() => {
    els[id].forEach(e => e.classList.remove(cls));
    if (peek) labels[id].classList.remove('peek');
  }, ms);
}
function popLabel(id) {
  const l = labels[id];
  l.classList.remove('pop'); void l.getBoundingClientRect(); l.classList.add('pop');
}

/* ---------- actions ---------- */
function setFb(r, type, text) { r.fb = type ? { type, text } : null; }

function solve(r, id, first, revealed) {
  r.solved[id] = { first, revealed: !!revealed };
  r.order.push(id);
  if (r.pool.every(p => r.solved[p])) {
    r.done = true; clockStop(r);
    setTimeout(() => { sfx('win'); confetti(); }, 350);
  }
}

function onRegion(id) {
  const r = R();
  if (r.done || !r.pool.includes(id)) return;
  clockStart(r);
  if (S.mode === 'write') {
    if (r.solved[id]) { r.selected = null; setFb(r, 'info', t('already', { name: META[id].n })); render(); return; }
    r.selected = id;
    setFb(r, null);
    $('answer').value = '';
    render();
    $('answer').focus();
    return;
  }
  if (r.solved[id]) return;
  const target = r.queue[0];
  if (id === target) {
    r.queue.shift();
    solve(r, id, !r.tries[id] && !r.hints[id]);
    setFb(r, 'ok', t('found', { p: praise(), name: fullName(id) }));
    sfx('ok');
    render(); popLabel(id);
  } else {
    r.tries[target] = (r.tries[target] || 0) + 1;
    setFb(r, 'bad', t('findWrong', { name: META[id].n }) + (r.tries[target] >= 2 ? ' ' + t('findHint') : ''));
    sfx('bad');
    render();
    flash(id, 'wrong', 1500, true);
  }
}

function submitAnswer() {
  const r = R(), id = r.selected;
  if (!id || r.done) return;
  const input = $('answer');
  const { res, other } = check(input.value, id);
  if (res === 'empty') { setFb(r, 'warn', t('empty')); render(); input.focus(); return; }
  if (res === 'ok') {
    solve(r, id, !r.tries[id] && !r.hints[id]);
    r.selected = null;
    setFb(r, 'ok', t('correct', { p: praise(), name: fullName(id) }));
    sfx('ok');
    render(); popLabel(id);
    return;
  }
  if (res === 'near') { setFb(r, 'warn', t('near')); sfx('soft'); }
  else {
    r.tries[id] = (r.tries[id] || 0) + 1;
    sfx('bad');
    if (res === 'other') { setFb(r, 'bad', t('other', { name: META[other].n })); flash(other, 'pointing', 1900, true); }
    else setFb(r, 'bad', t('wrong'));
    input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
  }
  render();
  input.select();
}

function letters(id) { return [...META[id].n].filter(ch => /\p{L}/u.test(ch)).length; }
function useHint() {
  const r = R(), id = r.selected;
  if (!id) return;
  r.hints[id] = Math.min(letters(id) - 1, (r.hints[id] || 0) + 1);
  render();
  $('answer').focus();
}
function giveUp() {
  const r = R(), id = r.selected;
  if (!id) return;
  solve(r, id, false, true);
  r.selected = null;
  setFb(r, 'info', t('revealed', { name: fullName(id) }));
  sfx('soft');
  render(); popLabel(id);
}
function pickRandom() {
  const r = R();
  const left = r.pool.filter(id => !r.solved[id] && id !== r.selected);
  if (left.length) onRegion(left[Math.floor(Math.random() * left.length)]);
}
function skip() {
  const r = R();
  if (r.queue.length < 2) return;
  const id = r.queue.shift();
  r.hints[id] = 1;
  r.queue.push(id);
  setFb(r, null);
  render();
}
function switchMode(mode) {
  if (S.mode === mode) return;
  clockStop(R());
  S.mode = mode;
  const r = R();
  if (r.started && !r.done) clockStart(r);
  render();
}
function restart(pool) {
  clockStop(R());
  S[S.mode] = newRound(S.mode, pool);
  $('answer').value = '';
  render();
}
function applyCities() {
  for (const m of ['write', 'find']) {
    const r = S[m];
    if (r.done || r.review) { S[m] = newRound(m); continue; }
    if (prefs.cities) {
      for (const c of CITY) {
        if (r.pool.includes(c)) continue;
        r.pool.push(c);
        if (m === 'find') r.queue.splice(1 + Math.floor(Math.random() * r.queue.length), 0, c);
      }
    } else {
      r.pool = r.pool.filter(id => !CITY.includes(id));
      r.queue = r.queue.filter(id => !CITY.includes(id));
      r.order = r.order.filter(id => !CITY.includes(id));
      for (const c of CITY) { delete r.solved[c]; delete r.tries[c]; delete r.hints[c]; }
      if (CITY.includes(r.selected)) r.selected = null;
      if (r.pool.every(p => r.solved[p])) { r.done = true; clockStop(r); }
    }
  }
}

/* ---------- render ---------- */
function render() {
  const r = R(), write = S.mode === 'write';
  document.documentElement.lang = prefs.lang;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
  $('subtitle').textContent = prefs.cities ? t('sub19') : t('sub17');
  svg.setAttribute('aria-label', t('map'));
  $('tab-write').setAttribute('aria-selected', String(write));
  $('tab-find').setAttribute('aria-selected', String(!write));
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === prefs.lang)));
  $('tg-sound').setAttribute('aria-pressed', String(prefs.sound));
  $('tg-cities').setAttribute('aria-pressed', String(prefs.cities));

  const full = fullPool(), target = write ? null : r.queue[0];
  for (const id of ALL) {
    const inFull = full.includes(id), given = inFull && !r.pool.includes(id), s = r.solved[id];
    const named = given || !!s;
    for (const e of els[id]) {
      e.classList.toggle('off', !inFull);
      e.classList.toggle('given', given);
      e.classList.toggle('solved', !!s);
      e.classList.toggle('revealed', !!(s && s.revealed));
      e.classList.toggle('selected', write && r.selected === id);
      e.classList.toggle('hinting', !r.done && target === id && (r.tries[id] || 0) >= 2);
    }
    shapes[id].setAttribute('tabindex', inFull && !named && !r.done ? '0' : '-1');
    shapes[id].setAttribute('aria-label', named ? META[id].n : t('unnamed'));
    labels[id].classList.toggle('show', inFull && named);
  }

  const showIdle = write && !r.done && !r.selected;
  const showAsk = write && !r.done && !!r.selected;
  $('q-idle').hidden = !showIdle;
  $('q-ask').hidden = !showAsk;
  $('q-find').hidden = write || r.done;
  $('q-done').hidden = !r.done;
  $('q-review').hidden = !r.review || r.done;
  $('q-review').textContent = t('reviewBadge');

  if (showIdle) {
    $('idle-title').textContent = r.order.length ? t('idleNext') : t('idleTitle');
    $('btn-pick').hidden = !r.pool.some(id => !r.solved[id]);
  }
  if (showAsk) {
    const id = r.selected, k = r.hints[id] || 0;
    $('ask-title').textContent = META[id].city ? t('askCity') : t('askTitle');
    const slots = $('slots');
    slots.hidden = !k;
    if (k) {
      let li = 0;
      slots.innerHTML = [...META[id].n].map(ch => {
        if (/\p{L}/u.test(ch)) { const on = li++ < k; return `<span class="slot${on ? ' on' : ''}">${on ? ch : ''}</span>`; }
        return ch === ' ' ? '<span class="gap"></span>' : `<span class="sym">${ch}</span>`;
      }).join('');
    }
    $('btn-hint').disabled = k >= letters(id) - 1;
  }
  if (!write && !r.done) {
    $('find-target').textContent = target ? META[target].n : '';
    $('btn-skip').hidden = r.queue.length < 2;
  }
  if (r.done) {
    const first = r.pool.filter(id => r.solved[id].first).length, total = r.pool.length;
    const ratio = first / total, stars = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : 1;
    $('done-stars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    $('done-text').textContent = t('doneText', { first, total, time: fmtTime(clockValue(r)) });
    const missed = total - first;
    $('btn-review').hidden = !missed;
    $('btn-review').textContent = t('review', { k: missed });
  }

  const fb = $('fb');
  fb.hidden = !r.fb;
  if (r.fb) { fb.className = 'fb ' + r.fb.type; fb.textContent = r.fb.text; }

  const solvedCount = r.pool.filter(id => r.solved[id]).length;
  $('st-done').textContent = solvedCount + '/' + r.pool.length;
  $('st-first').textContent = r.pool.filter(id => r.solved[id] && r.solved[id].first).length;
  $('st-time').textContent = fmtTime(clockValue(r));

  $('atlas-empty').hidden = r.order.length > 0;
  const chips = r.order.map(id => `<li class="chip${r.solved[id].revealed ? ' rev' : ''}" data-chip="${id}" style="--h:${META[id].h}"><span class="dot"></span><span class="nm">${META[id].n}</span></li>`);
  for (let i = r.order.length; i < r.pool.length; i++) chips.push('<li class="empty" aria-hidden="true"></li>');
  $('legend').innerHTML = chips.join('');
}

/* ---------- confetti ---------- */
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('confetti'), ctx = c.getContext('2d');
  c.hidden = false;
  const dpr = window.devicePixelRatio || 1, w = innerWidth, hgt = innerHeight;
  c.width = w * dpr; c.height = hgt * dpr; ctx.scale(dpr, dpr);
  const hues = ALL.map(id => META[id].h);
  const bits = Array.from({ length: 150 }, () => ({
    x: Math.random() * w, y: -20 - Math.random() * hgt * 0.4, vx: (Math.random() - 0.5) * 2.4, vy: 2 + Math.random() * 3.5,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, s: 6 + Math.random() * 6, h: hues[Math.floor(Math.random() * hues.length)],
  }));
  const t0 = performance.now();
  (function frame(now) {
    ctx.clearRect(0, 0, w, hgt);
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.vy += 0.05; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.fillStyle = `hsl(${b.h} 80% 58%)`; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
      ctx.restore();
    }
    if (now - t0 < 3200) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, w, hgt); c.hidden = true; }
  })(t0);
}

/* ---------- wiring ---------- */
function wire() {
  svg.addEventListener('click', e => { const el = e.target.closest('[data-id]'); if (el) onRegion(el.dataset.id); });
  svg.addEventListener('keydown', e => {
    const el = e.target.closest('[data-id]');
    if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onRegion(el.dataset.id); }
  });
  $('answer-form').addEventListener('submit', e => { e.preventDefault(); submitAnswer(); });
  $('btn-hint').addEventListener('click', useHint);
  $('btn-giveup').addEventListener('click', giveUp);
  $('btn-pick').addEventListener('click', pickRandom);
  $('btn-skip').addEventListener('click', skip);
  $('btn-again').addEventListener('click', () => restart());
  $('btn-review').addEventListener('click', () => { const r = R(); restart(r.pool.filter(id => !r.solved[id].first)); });
  $('tab-write').addEventListener('click', () => switchMode('write'));
  $('tab-find').addEventListener('click', () => switchMode('find'));
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    prefs.lang = b.dataset.lang; savePrefs();
    for (const m of ['write', 'find']) S[m].fb = null;
    render();
  }));
  $('tg-sound').addEventListener('click', () => { prefs.sound = !prefs.sound; savePrefs(); render(); });
  $('tg-cities').addEventListener('click', () => { prefs.cities = !prefs.cities; savePrefs(); applyCities(); render(); });
  $('btn-restart').addEventListener('click', () => { $('confirm').hidden = false; });
  $('btn-no').addEventListener('click', () => { $('confirm').hidden = true; });
  $('btn-yes').addEventListener('click', () => { $('confirm').hidden = true; restart(); });
  $('legend').addEventListener('click', e => { const li = e.target.closest('[data-chip]'); if (li) flash(li.dataset.chip, 'pointing', 1400, false); });
  setInterval(() => { if (R().since) $('st-time').textContent = fmtTime(clockValue(R())); }, 500);
}

function start(data) {
  if (data && data.S && data.S.write && data.S.find) S = data.S;
  buildMap();
  wire();
  render();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ S }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

})();
</script>
